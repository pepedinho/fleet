# new config

ENV: &default_env
  SECRET_TOKEN: $
  TEST_KEY: "oui"

timeout: 200

pipeline:
  # new field notifications
  notifications:
    on: [success, failure]
    channels:
      - service: discord
        url: https://discord.com/api/webhooks/REDACTED_WEBHOOK_ID/REDACTED_WEBHOOK_TOKEN
  jobs:
    build:
      steps:
        - cmd: cargo clean
        - cmd: cargo build

    test_rust:
      needs: [build]
      env:
        RUST_LOG: debug
      steps:
        - cmd: cargo test --test cli_test -- --test-threads=1

    echo_test:
      needs: [build]
      steps:
        - cmd: echo test 1

    sleep_test:
      steps:
        - cmd: sleep 5
        
    deploy:
      needs: [test_rust, echo_test]
      steps:
        - cmd: echo je suis arriver a la fin