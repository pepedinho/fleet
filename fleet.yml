# Self-test config for the fleet repository itself.
# Notifications are intentionally omitted: no live webhook URLs live in this repo.

ENV: &default_env
  SECRET_TOKEN: $
  TEST_KEY: "oui"

branches: ['*']

timeout: 200

pipeline:
  jobs:
    test_rust:
      env:
        RUST_LOG: debug
      steps:
        - cmd: cargo test --test cli_test -- --test-threads=1

    sleep_test:
      env: *default_env
      steps:
        - cmd: sleep 5
        
    deploy:
      needs: [test_rust]
      steps:
        - cmd: echo je suis arriver a la fin