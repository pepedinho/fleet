name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build release binaries
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            asset: fleet-linux-x86_64.tar.gz
            cross: false
          - target: armv7-unknown-linux-gnueabihf
            asset: fleet-linux-armv7.tar.gz
            cross: true

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Install cross
        if: matrix.cross
        run: cargo install cross --version 0.2.5

      - name: Build release binaries
        run: |
          if [ "${{ matrix.cross }}" = "true" ]; then
            cross build --release --locked --target "${{ matrix.target }}"
          else
            cargo build --release --locked
          fi

      - name: Package binaries
        run: |
          mkdir -p dist
          if [ "${{ matrix.cross }}" = "true" ]; then
            tar -C "target/${{ matrix.target }}/release" -czf "dist/${{ matrix.asset }}" fleet fleetd
          else
            tar -C target/release -czf "dist/${{ matrix.asset }}" fleet fleetd
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.target }}
          path: dist
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: dist-*
          merge-multiple: true

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/*.tar.gz \
            --title "Fleet ${GITHUB_REF_NAME}" \
            --notes "Changelog: https://github.com/pepedinho/fleet/blob/main/CHANGELOG.md"